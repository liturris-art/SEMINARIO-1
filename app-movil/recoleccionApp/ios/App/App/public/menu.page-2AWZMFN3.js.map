<ion-content class="menu-content">

  <!-- ══ HERO HEADER ══════════════════════════════════════ -->
  <div class="hero">
    <div class="hero-bg"></div>

    <div class="hero-body">
      <div class="avatar">{{ usuario.inicial }}</div>

      <div class="hero-text">
        <p class="saludo">{{ saludo }},</p>
        <h2 class="nombre">{{ usuario.nombre }}</h2>
        <span class="rol-badge">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
          {{ usuario.rol || 'Usuario' }}
        </span>
      </div>

      <ion-button fill="clear" class="settings-btn" (click)="ir('/configuracion')">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>

  <!-- ══ GRID DE OPCIONES ═════════════════════════════════ -->
  <div class="grid-wrapper">

    <!-- Mapa — tarjeta grande destacada -->
    <div class="card card-large card-mapa" (click)="ir('/home')">
      <div class="card-icon-wrap">
        <ion-icon name="map-outline"></ion-icon>
      </div>
      <div class="card-info">
        <h3>Mapa en vivo</h3>
        <p>Ver rutas y seguimiento GPS</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="card-arrow"></ion-icon>
    </div>

    <!-- Fila de dos tarjetas -->
    <div class="row-2">

      <div class="card card-sm card-perfil" (click)="ir('/perfil')">
        <div class="card-icon-wrap">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <h3>Perfil</h3>
        <p>Mi cuenta</p>
      </div>

      <div class="card card-sm card-historial" (click)="ir('/historial')">
        <div class="card-icon-wrap">
          <ion-icon name="time-outline"></ion-icon>
        </div>
        <h3>Historial</h3>
        <p>Recorridos</p>
      </div>

    </div>

    <!-- Reportes — tarjeta mediana -->
    <div class="card card-medium card-reportes" (click)="ir('/reportes')">
      <div class="card-icon-wrap">
        <ion-icon name="bar-chart-outline"></ion-icon>
      </div>
      <div class="card-info">
        <h3>Reportes</h3>
        <p>Estadísticas y resúmenes de actividad</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="card-arrow"></ion-icon>
    </div>

  </div>

</ion-content>
