<ion-header>
  <ion-toolbar style="--background:#e91e63;--color:white">
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Mi perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleEditar()">
        <ion-icon [name]="editando ? 'close-outline' : 'create-outline'" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="perfil-content">

  <div *ngIf="cargando" class="loading-center">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div *ngIf="!cargando">

    <!-- Avatar y nombre -->
    <div class="hero-perfil">
      <div class="avatar-grande">{{ inicial }}</div>
      <h2>{{ usuario.nombre || 'Sin nombre' }}</h2>
      <span class="rol-chip">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        {{ usuario.rol || 'Usuario' }}
      </span>
    </div>

    <!-- Datos (vista) -->
    <div class="seccion" *ngIf="!editando">
      <div class="info-row">
        <ion-icon name="mail-outline"></ion-icon>
        <div>
          <p class="info-label">Correo electrónico</p>
          <p class="info-valor">{{ usuario.email }}</p>
        </div>
      </div>
      <div class="info-row">
        <ion-icon name="call-outline"></ion-icon>
        <div>
          <p class="info-label">Teléfono</p>
          <p class="info-valor">{{ usuario.telefono || 'No registrado' }}</p>
        </div>
      </div>
      <div class="info-row">
        <ion-icon name="card-outline"></ion-icon>
        <div>
          <p class="info-label">Documento</p>
          <p class="info-valor">{{ usuario.documento || 'No registrado' }}</p>
        </div>
      </div>
      <div class="info-row">
        <ion-icon name="finger-print-outline"></ion-icon>
        <div>
          <p class="info-label">ID de usuario</p>
          <p class="info-valor id-val">{{ usuario.id }}</p>
        </div>
      </div>
    </div>

    <!-- Formulario de edición -->
    <div class="seccion" *ngIf="editando">
      <ion-item class="input-item">
        <ion-input label="Nombre" label-placement="floating" [(ngModel)]="nombre"></ion-input>
      </ion-item>
      <ion-item class="input-item">
        <ion-input label="Teléfono" label-placement="floating" type="tel" [(ngModel)]="telefono"></ion-input>
      </ion-item>
      <ion-button expand="block" color="success" class="save-btn" (click)="guardar()">
        <ion-icon name="checkmark-outline" slot="start"></ion-icon>
        Guardar cambios
      </ion-button>
    </div>

  </div>

</ion-content>
