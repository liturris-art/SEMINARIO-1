<ion-header>
  <ion-toolbar style="--background:#e91e63; --color:white;">
    <ion-title>Nueva contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="verificando" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:#777">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Verificando enlace...</p>
  </div>

  <div *ngIf="!verificando && sesionActiva" style="max-width:400px;margin:30px auto">

    <div style="text-align:center;margin-bottom:30px">
      <ion-icon name="lock-open-outline" style="font-size:60px;color:#e91e63"></ion-icon>
      <h2 style="font-weight:600;color:#333">Crea tu nueva contraseña</h2>
      <p style="color:#777;font-size:14px">Mínimo 6 caracteres.</p>
    </div>

    <ion-item style="--border-radius:12px;margin-bottom:12px">
      <ion-input label="Nueva contraseña" label-placement="floating"
        [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password">
      </ion-input>
      <ion-button slot="end" fill="clear" (click)="togglePassword()" tabindex="-1">
        <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item style="--border-radius:12px;margin-bottom:12px">
      <ion-input label="Confirmar contraseña" label-placement="floating"
        [type]="showPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword">
      </ion-input>
    </ion-item>

    <ion-button expand="block"
      style="--background:#e91e63;--border-radius:12px;height:48px;font-weight:bold;margin-top:20px"
      [disabled]="!password || !confirmPassword"
      (click)="updatePassword()">
      <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
      Actualizar contraseña
    </ion-button>

  </div>

</ion-content>
