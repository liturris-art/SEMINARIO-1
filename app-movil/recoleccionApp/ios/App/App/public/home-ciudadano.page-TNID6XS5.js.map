<ion-header class="home-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="irAlMenu()" *ngIf="tieneSesion">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

    <div class="header-user">
      <div class="header-avatar">{{ inicialUsuario }}</div>
      <div class="header-info">
        <span class="header-nombre">{{ nombreUsuario }}</span>
        <span class="header-rol">Ciudadano</span>
      </div>
    </div>

    <ion-buttons slot="end">
      <ion-button *ngIf="!tieneSesion" (click)="irAlLogin()" fill="outline" size="small" color="primary">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Iniciar sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="home-content" [scrollY]="false">

  <!-- Mapa completo -->
  <div class="mapa-fullscreen">
    <app-map-view
      [rutas]="rutas"
      [calles]="calles"
      userRole="ciudadano">
    </app-map-view>
  </div>

  <!-- Panel inferior -->
  <div class="panel" [class.panel-cerrado]="!panelAbierto">

    <div class="panel-handle" (click)="togglePanel()">
      <div class="handle-bar"></div>
      <ion-icon [name]="panelAbierto ? 'chevron-down-outline' : 'chevron-up-outline'" class="handle-icon"></ion-icon>
    </div>

    <div class="panel-body">

      <!-- Estado del camión -->
      <div class="camion-card" [class.activo]="camionActivo">
        <div class="camion-icon">
          <ion-icon name="car-outline"></ion-icon>
        </div>
        <div class="camion-info">
          <span class="camion-titulo">Camión más cercano</span>
          <span class="camion-estado" *ngIf="camionActivo">
            A {{ distanciaCamion }}m · ETA {{ etaCamion }}
          </span>
          <span class="camion-estado sin" *ngIf="!camionActivo">
            Sin camiones activos ahora
          </span>
        </div>
        <div class="camion-badge" *ngIf="camionActivo">
          <span class="pulse-dot"></span>
          En zona
        </div>
      </div>

      <!-- Próxima recolección -->
      <div class="proxima-card">
        <ion-icon name="calendar-outline" class="proxima-icon"></ion-icon>
        <div class="proxima-info">
          <span class="proxima-label">Próxima recolección</span>
          <span class="proxima-fecha">{{ proximaFecha }}</span>
        </div>
        <div class="proxima-hora">{{ proximaHora }}</div>
      </div>

      <!-- CTA login si es anónimo -->
      <div class="cta-login" *ngIf="!tieneSesion">
        <ion-icon name="person-outline"></ion-icon>
        <p>Inicia sesión para ver el historial y más funciones</p>
        <ion-button size="small" color="primary" (click)="irAlLogin()">
          Iniciar sesión
        </ion-button>
      </div>

    </div>
  </div>

</ion-content>
